{% extends 'base.html' %}
{% load static %}

{% block styles %}
<link rel="stylesheet" href="{% static 'css/error_pages.css' %}">
{% endblock %}

{% block content %}
<section class="error-page">
    <div class="error-container">

        <div class="error-code">404</div>

        <h1>Oops! Page Not Found</h1>

        <p>
            The page you're looking for doesn't exist
            or may have been moved.
            Please check the URL or explore our blogs.
        </p>

        <div class="error-actions">
            <a href="{% url 'home' %}" class="error-btn primary-btn">
                Back to Home
            </a>

            <a href="{% url 'blog-list' %}" class="error-btn secondary-btn">
                Explore Blogs
            </a>
        </div>

    </div>
</section>
{% endblock %}
